<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flappy Sjef – Lønningspils</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="theme-arcade">
  <header class="hero">
    <h1>🕊️ Flappy Sjef</h1>
    <p class="sub"><a href="/">← Tilbake til lykkehjulet</a></p>
  </header>

  <main>
    <section id="not-joined" class="card hidden">
      <p>Du må <a href="/">hente lodd</a> før du kan spille.</p>
    </section>

    <section id="game-section" class="card hidden">
      <p class="game-info">
        Rekorden din: <strong id="best">0</strong> ·
        Neste belønning: <strong id="next"></strong>
      </p>
      <div class="game-wrap">
        <canvas id="game" width="400" height="600"></canvas>
      </div>
      <p class="note center">Trykk på skjermen, klikk eller trykk mellomrom for å flakse.</p>
      <p id="game-msg" class="result"></p>
    </section>

    <section class="card">
      <h2>Slik tjener du spinn</h2>
      <ul class="rewards" id="rewards"></ul>
      <p class="note">Hver belønning får du én gang, første gang du når poengsummen.</p>
    </section>

    <section class="card">
      <h2>🏆 Toppliste</h2>
      <ol id="leaderboard" class="leaderboard"></ol>
    </section>
  </main>

  <script src="/spill.js"></script>
  <script src="/admin-bubble.js"></script>
</body>
</html>
