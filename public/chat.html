<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chat – Lønningspils</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-page">
  <header class="chat-header">
    <a href="/" class="chat-back">←</a>
    <h1>💬 Chat</h1>
  </header>

  <div id="stories-bar" class="stories-bar compact"></div>

  <main id="messages" class="messages">
    <p class="muted center">Laster ...</p>
  </main>

  <form id="chat-form" class="chat-form hidden">
    <input id="chat-input" type="text" maxlength="500" placeholder="Skriv en melding ..." autocomplete="off">
    <button type="submit">Send</button>
  </form>
  <p id="chat-join" class="chat-form chat-join hidden">Du må <a href="/">registrere deg</a> for å chatte.</p>

  <script src="/media.js"></script>
  <script src="/stories.js"></script>
  <script src="/chat.js"></script>
  <script src="/admin-bubble.js"></script>
</body>
</html>
