<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gi og ta – Lønningspils</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="minimal">
  <header class="hero">
    <h1>🎁 Gi og ta</h1>
    <p class="sub"><a href="/admin.html">← Tilbake til admin</a></p>
  </header>

  <main>
    <section id="login" class="card">
      <h2>Logg inn</h2>
      <form id="login-form">
        <input id="password" type="password" placeholder="Admin-passord" required>
        <button type="submit">Logg inn</button>
      </form>
      <p id="login-msg" class="error"></p>
    </section>

    <div id="panel" class="hidden">
      <section class="card">
        <p class="field-label">Hva vil du dele ut?</p>
        <div class="step-chips" id="kinds">
          <button type="button" class="chip active" data-kind="spins">🎡 Spinn</button>
          <button type="button" class="chip" data-kind="cash">💰 Cash</button>
          <button type="button" class="chip" data-kind="beer">🍺 Pils</button>
        </div>
        <p class="field-label">Hvor mange <span id="kind-word">spinn</span> per trykk?</p>
        <div class="step-chips" id="steps"></div>
        <p id="beer-note" class="muted hidden">Pils du gir kommer fra budsjettet og vises som «pils til gode» i baren.</p>
        <input id="search" type="search" placeholder="Søk etter navn ..." class="search">
        <p id="msg" class="result"></p>
      </section>

      <section class="card">
        <h2>Deltakere (<span id="count">0</span>)</h2>
        <ul id="players" class="spin-players"></ul>
      </section>

      <section class="card">
        <h2>Siste endringer</h2>
        <ul id="log" class="duel-list"></ul>
      </section>
    </div>
  </main>

  <script src="/media.js"></script>
  <script src="/beerwins.js"></script>
  <script src="/admin-spinn.js"></script>
  <script src="/admin-bubble.js"></script>
</body>
</html>
