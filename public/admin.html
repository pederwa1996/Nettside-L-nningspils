<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin – Lønningspils</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="hero">
    <h1>🔐 Admin</h1>
    <p class="sub"><a href="/">← Tilbake</a></p>
  </header>

  <main>
    <section class="card">
      <h2>Logg inn</h2>
      <form id="login-form">
        <input id="password" type="password" placeholder="Admin-passord" required>
        <button type="submit">Logg inn</button>
      </form>
      <p id="msg" class="error"></p>
    </section>

    <section id="panel" class="card hidden">
      <h2>Loddtrekning</h2>
      <button id="draw-btn" class="big">🎲 Kjør loddtrekning</button>
      <div id="draw-result"></div>

      <h2>Deltakere (<span id="count">0</span>)</h2>
      <table class="admin-table">
        <thead><tr><th>Navn</th><th>Lodd</th><th>Spinn</th><th>Øl fra hjul</th><th>Flappy</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>

      <h2>Story (<span id="story-count">0</span>)</h2>
      <div id="admin-stories" class="admin-stories"></div>

      <h2>Mogg-off-pallen</h2>
      <ul id="admin-mogg" class="duel-list"></ul>

      <h2>Chat</h2>
      <ul id="admin-chat" class="duel-list"></ul>
      <button id="clear-chat-btn" class="secondary">Tøm hele chatten</button>

      <h2>Farlig sone</h2>
      <div class="danger">
        <button id="reset-draw-btn" class="secondary">Angre trekning</button>
        <button id="reset-all-btn" class="secondary">Slett alt og start på nytt</button>
      </div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
